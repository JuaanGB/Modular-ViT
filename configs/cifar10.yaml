dataset:
  name: "CIFAR10"
  in_channels: 3  # Para PatchEmbedding
  img_size: 32    # Para PatchEmbedding

training:
  batch_size: 64
  lr: 0.001
  epochs: 5
  weight_decay: 0.05

model:
  name: "CIFAR10-ViTBase"
  embed_dim: 256 # Para PatchEmbedding, PositionalEncoding, TokenInjection
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0

  patch_embedding:
    type: "vanilla"
    size: 4

  token_injection:
    type: "cls"

  positional_encoding:
    type: "learnable"

  aggregation:
    type: "cls"  

  attention:
    type: "vanilla"