dataset:
  name: "CIFAR10"
  in_channels: 3
  img_size: 224

training:
  batch_size: 64
  lr: 0.001
  epochs: 70
  weight_decay: 0.05

model:
  name: "CIFAR10-ViTBase"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0

  patch_embedding:
    type: "vanilla"
    size: 16

  token_injection:
    type: "cls"

  positional_encoding:
    type: "absolute"

  aggregation:
    type: "cls"  
