dataset:
  name: "CIFAR10"
  in_channels: 3
  img_size: 32
  num_classes: 10

training:
  batch_size: 64
  lr: 0.001
  epochs: 70
  weight_decay: 0.05

model:
  name: "CIFAR10-ViT-APT"
  embed_dim: 192
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0

  patch_embedding:
    type: "adaptive"
    size: 4
    apt_scales: 3
    apt_thresholds: 
      - 4.5
      - 3.0

  token_injection:
    type: "cls"

  positional_encoding:
    type: "absolute"

  aggregation:
    type: "cls"  
